name: Full CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/**'

jobs:
  backend:
    uses: ./.github/workflows/backend.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  coverage:
    needs: [backend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/unit/

      - name: Download e2e coverage
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
          path: coverage/e2e/

      - name: Merge and report coverage
        run: |
          covpercent() {
            go tool covdata percent -i="$1" | sed 's/\t\tgithub/\n\tgithub/g' | grep -v onedrive | grep "coverage:"
          }

          echo "=== Backend Unit Test Coverage ==="
          covpercent ./coverage/unit
          echo ""

          if [ -d ./coverage/e2e ] && [ "$(ls -A ./coverage/e2e 2>/dev/null)" ]; then
            echo "=== E2E Test Coverage ==="
            covpercent ./coverage/e2e
            echo ""

            echo "=== Combined Coverage ==="
            covpercent ./coverage/unit,./coverage/e2e
          else
            echo "No e2e coverage data available"
          fi

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: coverage/
          retention-days: 7
