name: E2E Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build backend with coverage
        working-directory: ./backend
        run: go build -cover -covermode=atomic -o pwsafe-service cmd/pwsafe-service/main.go

      - name: Build frontend
        working-directory: ./frontend
        run: npm ci && npm run build

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Create coverage directory
        run: mkdir -p /tmp/e2e-coverdata

      - name: Run e2e tests
        working-directory: ./e2e
        env:
          GOCOVERDIR: /tmp/e2e-coverdata
        run: npm test

      - name: Report e2e coverage
        if: always()
        run: |
          if [ -d /tmp/e2e-coverdata ] && [ "$(ls -A /tmp/e2e-coverdata 2>/dev/null)" ]; then
            echo "=== E2E Coverage ==="
            go tool covdata percent -i=/tmp/e2e-coverdata
          else
            echo "No coverage data produced"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: /tmp/e2e-coverdata/
          retention-days: 1
          if-no-files-found: ignore
